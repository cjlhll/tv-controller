services:
  api:
    build:
      context: ../..
      dockerfile: cloud/local-server/Dockerfile
    image: tvlock-api:latest
    container_name: tvlock-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATA_FILE: /data/data.json
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      SUBSCRIBE_TEMPLATE_ID: ${SUBSCRIBE_TEMPLATE_ID:-fx5fNlSC6_wEfd9ub-bqwbOH9EC8MVIHPK29WSaU-oE}
      MINIPROGRAM_STATE: ${MINIPROGRAM_STATE:-developer}
    volumes:
      - /opt/tvlock/data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
